name: Sync Mappings

"on":
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      provider:
        description: "Provider to sync (all, serieskao, poseidonhd2, gnula, allcalidad)"
        required: false
        default: "all"
        type: string
      type:
        description: "Content type to sync (movie, series, or both)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - "movie"
          - "series"
      limit:
        description: "Limit items per provider (empty for all)"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Dry run without committing changes"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  sync:
    name: Sync Mappings & Export Orion Indexes
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite
        run: |
          pytest tests/unit/ -q --tb=short

      - name: Run sync pipeline
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          ARGS="sync"
          if [ -n "${{ github.event.inputs.provider }}" ]; then
            ARGS="$ARGS --provider ${{ github.event.inputs.provider }}"
          fi
          if [ -n "${{ github.event.inputs.type }}" ]; then
            ARGS="$ARGS --type ${{ github.event.inputs.type }}"
          fi
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python main.py $ARGS

      - name: Commit and push changes
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/mappings/ data/orion_mappings/
          if git diff --staged --quiet; then
            echo "No mapping changes detected to commit."
          else
            git commit -m "chore(mappings): auto-sync provider mappings [skip ci]"
            git push
          fi
