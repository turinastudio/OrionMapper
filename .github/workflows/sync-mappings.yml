name: Sync Mappings

# Twice daily, off-peak Argentina (UTC-3), off-minute to avoid the :00/:30
# scheduling rush: 04:17 ART (07:17 UTC) and 16:17 ART (19:17 UTC).
"on":
  schedule:
    - cron: "17 7 * * *"
    - cron: "17 19 * * *"
  workflow_dispatch:
    inputs:
      provider:
        description: "Provider to sync"
        required: false
        default: "all"
        type: choice
        options:
          - "all"
          - "serieskao"
          - "pelisgratishd"
          - "poseidonhd2"
          - "gnula"
          - "allcalidad"
          - "allpeliculas"
      type:
        description: "Content type to sync (movie, series, or both)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - "movie"
          - "series"
      limit:
        description: "Limit items per provider (empty for all)"
        required: false
        default: ""
        type: string
      max_pages:
        description: "Global safety limit for catalog pages per provider/type"
        required: false
        default: "1000"
        type: string
      pages_per_run:
        description: "Historical catalog pages to scan per provider/type in this run"
        required: false
        default: "10"
        type: string
      head_pages:
        description: "Newest catalog pages checked every run"
        required: false
        default: "5"
        type: string
      history_overlap:
        description: "Historical pages to overlap between runs"
        required: false
        default: "5"
        type: string
      dry_run:
        description: "Dry run without committing changes"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  sync:
    name: Sync Mappings & Export Orion Indexes
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: sync-mappings
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Restore AllCalidad MD5 index
        run: |
          mkdir -p data/allcalidad
          if [ ! -f data/allcalidad/md5-index.bin ]; then
            python -m orion_mapper.resolver.allcalidad_md5 --generate
          fi

      - name: Run test suite
        run: |
          pytest tests/unit/ -q --tb=short

      - name: Run sync pipeline
        env:
          ORION_TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          ARGS="sync"
          if [ -n "${{ github.event.inputs.provider }}" ]; then
            ARGS="$ARGS --provider ${{ github.event.inputs.provider }}"
          fi
          if [ -n "${{ github.event.inputs.type }}" ]; then
            ARGS="$ARGS --type ${{ github.event.inputs.type }}"
          fi
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          if [ -n "${{ github.event.inputs.max_pages }}" ]; then
            ARGS="$ARGS --max-pages ${{ github.event.inputs.max_pages }}"
          fi
          if [ -n "${{ github.event.inputs.pages_per_run }}" ]; then
            ARGS="$ARGS --pages-per-run ${{ github.event.inputs.pages_per_run }}"
          fi
          if [ -n "${{ github.event.inputs.head_pages }}" ]; then
            ARGS="$ARGS --head-pages ${{ github.event.inputs.head_pages }}"
          fi
          if [ -n "${{ github.event.inputs.history_overlap }}" ]; then
            ARGS="$ARGS --history-overlap ${{ github.event.inputs.history_overlap }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Daily: only the 5 newest pages per provider/type (new entries).
            # No historical cursor walk; sync_state.json stays untouched.
            ARGS="$ARGS --head-pages 5 --head-only"
          fi
          python main.py $ARGS --rate-limit 1.0

      - name: Commit and push changes
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/mappings/movies.json data/mappings/series.json data/sync_state.json data/unresolved/
          if git diff --staged --quiet; then
            echo "No mapping changes detected to commit."
          else
            git commit -m "chore(mappings): auto-sync provider mappings [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME:-main}" || true
            git push
          fi
