[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orion-mapper"
version = "0.1.0"
description = "High-performance cross-provider identity mapper and scraper system for movies and series"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Orion Team" }
]
dependencies = [
    "httpx[http2]>=0.27.0",
    "h2>=4.1.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "beautifulsoup4>=4.12.0",
    "selectolax>=0.3.21",
    "rapidfuzz>=3.8.0",
    "unidecode>=1.3.8",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
orion-mapper = "orion_mapper.cli.commands:app"

[tool.hatch.build.targets.wheel]
packages = ["src/orion_mapper"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
markers = [
    "tier1: Tier 1 Feature Coverage tests",
    "tier2: Tier 2 Boundary and Corner Case tests",
    "tier3: Tier 3 Cross-Feature Combination tests",
    "tier4: Tier 4 Real-World Application Scenario tests",
    "e2e: End-to-end integration tests",
    "orion_compat: OrionServer compatibility tests",
    "cli: Command-line interface tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "ASYNC", "B", "RUF"]
ignore = ["E501", "ASYNC109"]
